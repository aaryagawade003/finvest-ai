version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: finvest-postgres
    environment:
      POSTGRES_DB: finvest_db
      POSTGRES_USER: finvest
      POSTGRES_PASSWORD: finvest123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend-spring/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - finvest-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finvest -d finvest_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis Cache
  redis:
    image: redis:7-alpine
    container_name: finvest-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - finvest-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Zookeeper for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: finvest-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - finvest-net

  # 4. Apache Kafka Message Broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: finvest-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - finvest-net

  # 5. Python FastAPI AI & Analytics Engine
  backend-ai:
    build:
      context: ./backend-ai-service
      dockerfile: Dockerfile
    container_name: finvest-ai-service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    networks:
      - finvest-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 6. Java Spring Boot Enterprise Core
  backend-spring:
    build:
      context: ./backend-spring
      dockerfile: Dockerfile
    container_name: finvest-spring-core
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=finvest_db
      - DB_USER=finvest
      - DB_PASSWORD=finvest123
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - AI_SERVICE_URL=http://backend-ai:8000
    networks:
      - finvest-net

  # 7. React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finvest-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend-ai
    networks:
      - finvest-net

  # 8. Prometheus Observability
  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: finvest-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - finvest-net

  # 9. Grafana Dashboards
  grafana:
    image: grafana/grafana:10.3.3
    container_name: finvest-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafanadata:/var/lib/grafana
    networks:
      - finvest-net

networks:
  finvest-net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  grafanadata:
